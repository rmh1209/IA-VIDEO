[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoopcut"
version = "0.1.0"
description = "IA qui transforme un résumé de match ou une compilation de basket en short vertical de 60 à 80 secondes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.25",
    "pydantic>=2.6",
    "Pillow>=10.0",
    # default = résolution des défis JavaScript de YouTube (yt-dlp-ejs), deno = le moteur JavaScript
    "yt-dlp[default,deno]>=2026.8.19",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hoopcut = "hoopcut.cli:main"
hoopcut-interface = "hoopcut.interface:main"

[tool.setuptools.packages.find]
include = ["hoopcut*"]

[tool.setuptools.package-data]
hoopcut = ["assets/fonts/*", "interface.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
